<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CIO | Examen de Admisión</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-950 text-green-400 font-mono min-h-screen flex items-center justify-center p-4">

    <div class="max-w-2xl w-full border border-green-500/30 bg-black/80 p-6 rounded-lg shadow-2xl shadow-green-900/20">
        
        <!-- HEADER -->
        <div class="text-center mb-6 border-b border-green-500/30 pb-4">
            <h1 class="text-2xl font-bold tracking-widest text-green-300">OCTAGRAM ADMISSION SYSTEM</h1>
            <p class="text-xs text-gray-400 mt-1">Comunidad Internacional de Octagram (CIO)</p>
        </div>

        <!-- PASO 1: REGISTRO Y NIVEL -->
        <div id="step-1" class="space-y-4">
            <div>
                <label class="block text-xs uppercase text-green-500 mb-1">> Ingresa tu Alias / Handle:</label>
                <input type="text" id="user-alias" class="w-full bg-gray-900 border border-green-600/50 rounded p-2 text-green-300 focus:outline-none focus:border-green-400" placeholder="ej. Cipher_Octa">
            </div>

            <div>
                <label class="block text-xs uppercase text-green-500 mb-1">> Telegram / Correo de contacto:</label>
                <input type="text" id="user-contact" class="w-full bg-gray-900 border border-green-600/50 rounded p-2 text-green-300 focus:outline-none focus:border-green-400" placeholder="@tu_alias_tg">
            </div>

            <div>
                <label class="block text-xs uppercase text-green-500 mb-1">> Selecciona tu nivel técnico auto-evaluado:</label>
                <select id="user-level" class="w-full bg-gray-900 border border-green-600/50 rounded p-2 text-green-300 focus:outline-none focus:border-green-400">
                    <option value="1">🟢 Nivel 1: Fundamentos / Principiante</option>
                    <option value="2">🟡 Nivel 2: Intermedio / Junior+</option>
                    <option value="3">🔴 Nivel 3: Avanzado / Senior</option>
                </select>
            </div>

            <button onclick="startExam()" class="w-full bg-green-950 hover:bg-green-800 text-green-300 border border-green-500 font-bold py-2 rounded transition-all mt-4">
                [ INICIAR EVALUACIÓN ]
            </button>
        </div>

        <!-- PASO 2: CONTENEDOR DEL EXAMEN -->
        <div id="step-2" class="hidden space-y-6">
            <div id="quiz-container"></div>
            <button onclick="submitExam()" class="w-full bg-green-950 hover:bg-green-800 text-green-300 border border-green-500 font-bold py-2 rounded transition-all">
                [ ENVIAR RESPUESTAS ]
            </button>
        </div>

        <!-- PASO 3: FINALIZADO Y GENERACIÓN DE REPORTE -->
        <div id="step-3" class="hidden text-center space-y-4">
            <h2 class="text-xl text-green-300 font-bold">¡EVALUACIÓN COMPLETADA!</h2>
            <p class="text-sm text-gray-300">Copia la siguiente firma de respuestas y envíala a la administración de la CIO en Telegram para procesar tu postulación:</p>
            <textarea id="final-output" class="w-full h-40 bg-gray-900 border border-green-600/50 rounded p-2 text-xs font-mono text-green-400" readonly></textarea>
            <button onclick="copyResults()" class="bg-green-800 text-white px-4 py-2 rounded text-xs hover:bg-green-700">Copiar Ficha al Portapapeles</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
